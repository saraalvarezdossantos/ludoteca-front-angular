<div class="container">

    <h1>Gestión de préstamos</h1>

    <div class="filters">
        <form>

            <mat-form-field>
                <mat-label>Juego</mat-label>
                <mat-select disableRipple [(ngModel)]="filterGame" name="game">
                    <mat-option *ngFor="let game of games" [value]="game">
                        {{ game.title }}
                    </mat-option>
                </mat-select>
            </mat-form-field>

            <mat-form-field>
                <mat-label>Cliente</mat-label>
                <mat-select disableRipple [(ngModel)]="filterCustomer" name="customer">
                    <mat-option *ngFor="let customer of customers" [value]="customer">
                        {{ customer.name }}
                    </mat-option>
                </mat-select>
            </mat-form-field>

            <mat-form-field>
                <mat-label>Fecha</mat-label>

                <input matInput [matDatepicker]="picker" [(ngModel)]="filterDate" name="date">

                <mat-datepicker-toggle matSuffix [for]="picker">
                </mat-datepicker-toggle>

                <mat-datepicker #picker></mat-datepicker>

            </mat-form-field>

        </form>

        <div class="buttons">
            <button mat-stroked-button (click)="onCleanFilter()">
                Limpiar
            </button>

            <button mat-stroked-button (click)="onSearch()">
                Filtrar
            </button>
        </div>
    </div>

    <div class="loan-list">

        <table mat-table [dataSource]="dataSource">
            <ng-container matColumnDef="id">
                <th mat-header-cell *matHeaderCellDef>ID</th>
                <td mat-cell *matCellDef="let loan">
                    {{ loan.id }}
                </td>
            </ng-container>

            <ng-container matColumnDef="game">
                <th mat-header-cell *matHeaderCellDef>
                    Juego
                </th>
                <td mat-cell *matCellDef="let loan">
                    {{ loan.game.title }}
                </td>
            </ng-container>

            <ng-container matColumnDef="customer">
                <th mat-header-cell *matHeaderCellDef>
                    Cliente
                </th>
                <td mat-cell *matCellDef="let loan">
                    {{ loan.customer.name }}
                </td>
            </ng-container>

            <ng-container matColumnDef="startDate">
                <th mat-header-cell *matHeaderCellDef>
                    Fecha inicio
                </th>
                <td mat-cell *matCellDef="let loan">
                    {{ loan.startDate | date:'dd/MM/yyyy' }}
                </td>
            </ng-container>

            <ng-container matColumnDef="endDate">
                <th mat-header-cell *matHeaderCellDef>
                    Fecha fin
                </th>
                <td mat-cell *matCellDef="let loan">
                    {{ loan.endDate | date:'dd/MM/yyyy' }}
                </td>
            </ng-container>

            <ng-container matColumnDef="action">
                <th mat-header-cell *matHeaderCellDef></th>

                <td mat-cell *matCellDef="let loan">
                    <button mat-icon-button color="primary" (click)="editLoan(loan)">
                        <mat-icon>edit</mat-icon>
                    </button>

                    <button mat-icon-button color="accent" (click)="deleteLoan(loan)">
                        <mat-icon>clear</mat-icon>
                    </button>
                </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
        </table>
    </div>

    <mat-paginator (page)="loadPage($event)" [pageSizeOptions]="[5, 10, 20]" [pageIndex]="pageNumber"
        [pageSize]="pageSize" [length]="totalElements" showFirstLastButtons></mat-paginator>
    <div class="buttons">
        <button mat-flat-button color="primary" (click)="createLoan()">
            Nuevo préstamo
        </button>
    </div>

</div>
